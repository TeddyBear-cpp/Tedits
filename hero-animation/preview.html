<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reaching hands — loop preview</title>
  <style>
    :root{color-scheme:dark;font-family:Arial,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#171e25;color:#eaf0f3}
    main{width:min(1500px,calc(100% - 32px));padding-block:24px}
    video{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:26px;background:#354b60}
    .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:14px;font-size:13px}
    button{background:transparent;border:1px solid #8295a3;border-radius:999px;color:inherit;min-height:42px;padding:8px 18px;cursor:pointer}
    button:hover{background:#2c3944}
    @media(max-width:600px){video{border-radius:18px}.bar{font-size:11px}}
  </style>
</head>
<body>
  <main>
    <video id="hero" muted loop playsinline poster="output/poster.jpg" aria-label="Two hands nearly touching as clouds drift gently">
      <source src="output/reaching-hands-loop.mp4" type="video/mp4">
    </video>
    <div class="bar"><span>Eight-second seamless loop · silent</span><button id="toggle" type="button">Pause motion</button></div>
  </main>
  <script>
    const video=document.getElementById('hero');
    const button=document.getElementById('toggle');
    const reduced=matchMedia('(prefers-reduced-motion: reduce)');
    const syncButton=()=>{button.textContent=video.paused?'Play motion':'Pause motion';};
    video.addEventListener('play',syncButton);
    video.addEventListener('pause',syncButton);
    if(reduced.matches){video.pause();}else{video.play().catch(syncButton);}
    syncButton();
    button.addEventListener('click',()=>{if(video.paused){video.play().catch(syncButton);}else{video.pause();}});
    reduced.addEventListener('change',event=>{if(event.matches)video.pause();});
  </script>
</body>
</html>
