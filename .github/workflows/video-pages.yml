name: Deploy Tedits websites
on:
  push:
    branches: [main]
    paths:
      - index.html
      - video-preview.css
      - video-player.css
      - video-preview.js
      - contact.js
      - section-navigation.js
      - Assets/**
      - videos/**
      - build-video.cjs
      - build-studio.cjs
      - studio/index.html
      - studio/studio*.css
      - studio/studio*.js
      - studio/assets/**
      - studio/projects/**
      - .github/workflows/video-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: video-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Package video site and Studio collection
        run: |
          node build-video.cjs
          node build-studio.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site-video
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
